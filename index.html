<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DB Creator</title>
<style>
/* ChatGPT-inspired neutral workspace: white in light mode, charcoal in dark mode. */
:root{--bg:#fff;--panel:#fff;--panel-2:#fff;--ink:#111;--muted:#111;--line:#d8d8d8;--accent:#10a37f;--accent-soft:#e7f6f1;--danger:#c9362b;--hover:#f7f7f7;--shadow:none}
[data-theme="dark"]{--bg:#171717;--panel:#171717;--panel-2:#171717;--ink:#f1f1f1;--muted:#f1f1f1;--line:#484848;--accent:#20b792;--accent-soft:#143c33;--danger:#ff8a80;--hover:#252525;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh}.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:17px;letter-spacing:-.02em}.brand b{color:var(--accent)}.project-name{min-width:160px;flex:1}.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--panel);padding:0 16px}.nav button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 11px;font:inherit;font-weight:700;border-bottom:2px solid transparent}.nav button:hover,.list-button:hover,.quiet:hover{background:var(--hover)}.nav button.active{color:var(--ink);border-color:var(--accent)}button,.button{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:transparent;color:var(--ink);font:inherit;font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.quiet{border-color:transparent;background:transparent;color:var(--muted)}.danger{color:var(--danger)}.move{min-width:26px;padding:4px 6px}main{max-width:1660px;margin:auto;padding:12px 16px 28px}.grid{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:transparent;border:0;border-radius:0;padding:8px 0;box-shadow:none}.metric{font-size:24px;font-weight:780;letter-spacing:-.035em}.muted{color:var(--muted)}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}.two{display:grid;grid-template-columns:270px minmax(0,1fr);gap:10px}.three{display:grid;grid-template-columns:235px minmax(0,1fr) 260px;gap:10px}input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px 7px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 42%,transparent);border-color:var(--accent)}textarea{min-height:52px;resize:vertical}label{display:grid;gap:4px;font-size:13px;color:var(--ink);font-weight:750;text-transform:uppercase;letter-spacing:.025em}.small{font-size:12px}.field-list{display:grid;gap:3px}.table-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center}.list-button{width:100%;text-align:left;padding:7px;background:transparent}.list-button.active{border-color:var(--accent);background:var(--accent-soft)}.badge{font-size:11px;border-radius:4px;padding:2px 5px;background:var(--accent-soft);color:var(--accent);font-weight:800}.badge.warn{background:#fff2d9;color:#895600}.badge.danger{background:#ffe3de;color:#a32a1b}.bar{height:5px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.section{border:0;border-top:1px solid var(--line);border-radius:0;overflow:hidden;margin:8px 0}.section-title{padding:6px 9px;font-weight:800;border-left:4px solid var(--section);background:transparent}.field-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:0;padding:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}.field-card{padding:8px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:transparent}.field-card details{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}.choice-buttons{display:flex;gap:5px;flex-wrap:wrap}.choice{min-width:54px}.choice.selected{background:var(--accent);border-color:var(--accent);color:#fff}.meta{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:6px}.table-wrap{overflow:auto;max-height:250px;border:1px solid var(--line);border-radius:0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:var(--panel);color:var(--ink);z-index:1;text-transform:uppercase;font-size:10px;letter-spacing:.04em}.empty{padding:18px;text-align:center;color:var(--muted)}.notice{padding:7px 9px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0}.status{font-size:10px;font-weight:850;border-radius:4px;padding:2px 5px;display:inline-block;text-transform:uppercase;letter-spacing:.03em}.s-unreviewed{background:#e7eaed;color:#46515b}.s-progress{background:#fff2d9;color:#895600}.s-verified{background:#ddf4e5;color:#166b3a}.s-none{background:#e5e9ed;color:#4b5563}.section-edit{display:grid;grid-template-columns:64px 1fr 104px 114px 76px 68px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.sql{background:#090b0d;color:#d9fce8;padding:10px;border-radius:0;white-space:pre-wrap;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.hidden{display:none!important}@media(max-width:980px){.two,.three{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{padding:8px 10px;flex-wrap:wrap}.nav{padding:0 8px;overflow:auto}main{padding:10px}.field-grid{grid-template-columns:1fr!important}.meta,.section-edit{grid-template-columns:1fr 1fr}.section-edit button{max-width:50px}}
</style>
<style>input,select,textarea{color-scheme:light}[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{color-scheme:dark}</style>
</head>
<body><div id="app" class="app"></div>
<script>
const STATUS=['Unreviewed','In Progress','Verified','Not Available','Not Applicable'];
const TYPES=['text','long text','number','date','yes/no','select','button select'];
const uid=()=>crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const csvEscape=v=>'"'+String(v??'').replaceAll('"','""')+'"';
const STORE='fieldforge-local-v1';

function starter(){const parent={id:uid(),key:'recipients',name:'Recipients',kind:'parent',keyField:'recipient_id',grid:2,fields:[
 {id:uid(),key:'recipient_id',label:'Recipient ID',type:'text',section:'Identity',color:'#0f766e',order:1,required:true},
 {id:uid(),key:'weight_kg',label:'Weight (kg)',type:'number',section:'Identity',color:'#0f766e',order:2},
 {id:uid(),key:'donor',label:'Donor',type:'text',section:'Identity',color:'#0f766e',order:3},
 {id:uid(),key:'species',label:'Species',type:'text',section:'Identity',color:'#0f766e',order:4}
]};const child={id:uid(),key:'procedures',name:'Procedures',kind:'child',parentTable:'recipients',keyField:'procedure_id',grid:2,fields:[
 {id:uid(),key:'procedure_id',label:'Procedure ID',type:'text',section:'Procedure details',color:'#7c3aed',order:1},
 {id:uid(),key:'procedure_date',label:'Procedure date',type:'date',section:'Procedure details',color:'#7c3aed',order:2},
 {id:uid(),key:'procedure_type',label:'Procedure type',type:'text',section:'Procedure details',color:'#7c3aed',order:3},
 {id:uid(),key:'procedure_notes',label:'Notes',type:'long text',section:'Procedure details',color:'#7c3aed',order:4}
]};return {id:uid(),name:'Recipient Registry',createdAt:now(),updatedAt:now(),tables:[parent,child],records:[]}}
let state={projects:[],projectId:null,view:'records',activeParentId:null,activeChildId:null,activeTableKey:null,username:'',theme:'light',search:'',viewerTable:'all',viewerSearch:'',importTable:'recipients',importSourceLocation:''};
function repairChildLinks(){state.projects.forEach(p=>{const parents=p.tables?.filter(t=>t.kind==='parent')||[];if(parents.length!==1)return;const root=parents[0];p.tables.filter(t=>t.kind==='child').forEach(t=>t.parentTable=root.key)})}
function load(){try{const saved=JSON.parse(localStorage.getItem(STORE));if(saved&&saved.projects?.length)state={...state,...saved};else{const p=starter();state.projects=[p];state.projectId=p.id}}catch{const p=starter();state.projects=[p];state.projectId=p.id}repairChildLinks();document.documentElement.dataset.theme=state.theme||'light'}
function save(){const p=project();if(p)p.updatedAt=now();localStorage.setItem(STORE,JSON.stringify(state));}
function project(){return state.projects.find(p=>p.id===state.projectId)}
function table(key){return project()?.tables.find(t=>t.key===key)}
function parentTable(){return project()?.tables.find(t=>t.kind==='parent')}
function rec(id){return project()?.records.find(r=>r.id===id)}
function parentRecords(){const t=parentTable();return project()?.records.filter(r=>r.tableKey===t?.key)||[]}
function fields(t){return [...(t?.fields||[])].sort((a,b)=>(a.order||0)-(b.order||0))}
function sourceLocations(){const found=new Set();project()?.records.forEach(r=>Object.values(r.meta||{}).forEach(m=>{const value=String(m?.sourceLocation||'').trim();if(value)found.add(value)}));const imported=String(state.importSourceLocation||'').trim();if(imported)found.add(imported);return [...found].sort((a,b)=>a.localeCompare(b))}
function recordKeyField(t){const fs=fields(t);if(fs.some(f=>f.key===t?.keyField))return t.keyField;return (fs.find(f=>/(^|_)id$/i.test(f.key))||fs.find(f=>/_id$/i.test(f.key))||fs[0])?.key||t?.keyField||'record_id'}
function recordName(r,t){const value=r?.values?.[recordKeyField(t)];return String(value??'').trim()||'Untitled record'}
function terminal(s){return ['Verified','Not Available','Not Applicable'].includes(s)}
function progress(record,includeChildren=true){if(!record)return {total:0,done:0,entered:0,pct:0};let rs=[record];if(includeChildren){rs=rs.concat(project().records.filter(r=>r.parentId===record.id))}let total=0,done=0,entered=0;rs.forEach(r=>{const t=table(r.tableKey);fields(t).forEach(f=>{total++;const m=r.meta?.[f.key]||{};if(terminal(m.status))done++;if(String(r.values?.[f.key]??'')!=='')entered++})});return {total,done,entered,pct:total?Math.round(done/total*100):0}}
function statusClass(s){return s==='Verified'?'s-verified':s==='In Progress'?'s-progress':terminal(s)?'s-none':'s-unreviewed'}
function statusOptions(v){return STATUS.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}

function render(){document.documentElement.dataset.theme=state.theme;const p=project();if(!p)return;document.getElementById('app').innerHTML=`
<header class="top"><div class="brand">DB <b>Creator</b> <span class="muted small">Local</span></div><select onchange="App.chooseProject(this.value)">${state.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input class="project-name" value="${esc(p.name)}" onchange="App.renameProject(this.value)" aria-label="Project name"><button onclick="App.newProject()">New database</button><button class="quiet" onclick="App.toggleTheme()">${state.theme==='dark'?'Light mode':'Dark mode'}</button></header>
<nav class="nav">${[['records','Records'],['viewer','Current data'],['dictionary','Dictionary'],['data','Data & backups']].map(([v,l])=>`<button class="${state.view===v?'active':''}" onclick="App.view('${v}')">${l}</button>`).join('')}</nav>
<main>${state.view==='records'?recordsView():state.view==='viewer'?viewerView():state.view==='dictionary'?dictionaryEditorView():dataView()}</main><datalist id="source-location-list">${sourceLocations().map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`;}

function recordsView(){const pt=parentTable(), parents=parentRecords(), active=rec(state.activeParentId)||parents[0],singular=(pt?.name||'Record').replace(/s$/i,'');if(active&&!state.activeParentId)state.activeParentId=active.id;return `<div class="notice"><b>How to use this screen:</b> 1. Click <b>New ${esc(singular)}</b>. 2. Enter values in the middle form. 3. Open <b>Add source, status & notes</b> under a field to document where it came from and mark it reviewed. 4. Use <b>+ Add</b> in a repeating section such as Procedures to create extra rows for the same ${esc(singular.toLowerCase())}.</div><div class="grid stats" style="margin-top:12px">${metric('Parent records',parents.length)}${metric('Reviewed',active?progress(active).pct+'%':'—')}${metric('Entered',active?progress(active).entered+' / '+progress(active).total:'—')}${metric('Remaining',active?progress(active).total-progress(active).done:'—')}</div><div class="three" style="margin-top:16px"><aside class="card"><div class="spread"><b>${esc(pt?.name||'Records')}</b><button class="primary" onclick="App.addRecord('${pt?.key}')">+ New ${esc(singular)}</button></div><input placeholder="Search record IDs" style="margin:10px 0" value="${esc(state.search)}" oninput="App.search(this.value)"><div class="field-list">${parents.filter(r=>JSON.stringify(r.values).toLowerCase().includes(state.search.toLowerCase())).slice(0,120).map(r=>recordButton(r,pt)).join('')||'<div class="empty">Click “New '+esc(singular)+'” to create your first record.</div>'}</div></aside><section class="card">${active?parentForm(active):'<div class="empty"><b>Start here:</b><br>Click “New '+esc(singular)+'” in the left column.</div>'}</section><aside class="card">${active?reviewPanel(active):'<div class="empty">The review panel appears after you create a record.</div>'}</aside></div>`}
function metric(label,value){return `<div class="card"><div class="muted small">${label}</div><div class="metric">${value}</div></div>`}
function recordButton(r,t){const key=recordName(r,t),p=progress(r);return `<button class="list-button ${r.id===state.activeParentId?'active':''}" onclick="App.openRecord('${r.id}')"><div class="spread"><b>${esc(key)}</b><span class="badge">${p.pct}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${p.pct}%"></i></div></button>`}
function parentForm(r){const t=table(r.tableKey),p=progress(r),name=recordName(r,t),parents=project().tables.filter(x=>x.kind==='parent');const children=project().tables.filter(x=>x.kind==='child'&&(x.parentTable===t.key||parents.length===1));return `<div class="spread"><div><div class="muted small">${esc(t.name)} record</div><h2 style="margin:2px 0">${esc(name==='Untitled record'?'New record — enter the ID first':name)}</h2></div><div class="row"><div style="min-width:150px"><div class="small muted">Review progress</div><div class="bar"><i style="width:${p.pct}%"></i></div><b>${p.done} / ${p.total} reviewed</b></div><button class="quiet danger" onclick="App.deleteRecord('${r.id}')">Delete record</button></div></div><p class="muted small">Fast entry: use Tab to move across each row. Source ID is generated automatically.</p>${fastEntryTable(r,t)}${children.map(c=>childSection(r,c)).join('')}`}
function renderFields(r,t){const grouped={};fields(t).forEach(f=>(grouped[f.section||'Details']??=[]).push(f));return Object.entries(grouped).map(([section,fs])=>`<div class="section" style="--section:${fs[0].color||'#0f766e'}"><div class="section-title">${esc(section)}</div><div class="field-grid" style="--cols:${Math.min(4,Math.max(1,t.grid||2))}">${fs.map(f=>fieldCard(r,f)).join('')}</div></div>`).join('')}
function fieldChoices(f){return (Array.isArray(f.options)?f.options:String(f.options||'').split(',')).map(x=>String(x).trim()).filter(Boolean)}
function fieldCard(r,f){const v=r.values?.[f.key]??'',m=r.meta?.[f.key]||{},id=r.id,choices=f.type==='yes/no'?['Yes','No']:fieldChoices(f);let control=f.type==='long text'?`<textarea onchange="App.value('${id}','${f.key}',this.value)">${esc(v)}</textarea>`:f.type==='select'?`<select onchange="App.value('${id}','${f.key}',this.value)"><option value="">Select…</option>${choices.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:(f.type==='button select'||f.type==='yes/no')?`<div class="choice-buttons">${choices.length?choices.map(x=>`<button type="button" class="choice ${x===v?'selected':''}" data-value="${esc(x)}" onclick="App.value('${id}','${f.key}',this.dataset.value)">${esc(x)}</button>`).join(''):'<span class="small">No choices have been defined in Dictionary.</span>'}</div>`:`<input type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" value="${esc(v)}" onchange="App.value('${id}','${f.key}',this.value)">`;return `<div class="field-card"><div class="spread"><label>${esc(f.label)}${f.required?' *':''}${control}</label><span class="status ${statusClass(m.status)}">${esc(m.status||'Unreviewed')}</span></div><details><summary class="small muted">Add source, status & notes</summary><div class="meta"><label>Source ID<input value="${esc(m.sourceId||'')}" placeholder="Generated automatically" onchange="App.meta('${id}','${f.key}','sourceId',this.value)"></label><label>Source file / location<input list="source-location-list" value="${esc(m.sourceLocation||'')}" placeholder="Choose or type a new source file" onchange="App.meta('${id}','${f.key}','sourceLocation',this.value)"></label><label>Review status<select onchange="App.meta('${id}','${f.key}','status',this.value)">${statusOptions(m.status||'Unreviewed')}</select></label></div><label style="margin-top:7px">Notes<textarea onchange="App.meta('${id}','${f.key}','notes',this.value)">${esc(m.notes||'')}</textarea></label><div class="small muted">Source file/location is required before marking Verified. Edited: ${m.editedAt?new Date(m.editedAt).toLocaleString():'Never'}${m.user?' by '+esc(m.user):''}</div></details></div>`}
function childSection(parent,t){const rows=project().records.filter(r=>r.tableKey===t.key&&r.parentId===parent.id),fs=fields(t),editing=rec(state.activeChildId);return `<div class="section" style="--section:#7c3aed"><div class="section-title spread"><span>${esc(t.name)} <span class="muted small">(${rows.length})</span></span><button class="primary" onclick="App.addRecord('${t.key}','${parent.id}')">+ Add ${esc(t.name.slice(0,-1)||t.name)}</button></div>${rows.length?`<div class="table-wrap"><table><thead><tr>${fs.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th>Review</th><th></th></tr></thead><tbody>${rows.map(row=>`<tr>${fs.map(f=>`<td>${esc(row.values?.[f.key]||'—')}</td>`).join('')}<td>${progress(row,false).pct}%</td><td><span class="row"><button onclick="App.editChild('${row.id}')">Edit</button><button class="quiet danger" onclick="App.deleteRecord('${row.id}')">Delete</button></span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No related ${esc(t.name.toLowerCase())} yet.${fs.length?` This section will collect: <b>${fs.map(f=>esc(f.label)).join(', ')}</b>. Click “+ Add” to enter the first row.`:' Add fields for this table in Dictionary, then click “+ Add”.'}</div>`}${editing&&editing.tableKey===t.key&&editing.parentId===parent.id?`<div class="card" data-child-id="${editing.id}" style="margin:12px"><div class="spread"><b>Edit ${esc(t.name.slice(0,-1)||t.name)}</b><span class="row"><button onclick="App.closeChild()">Done</button><button class="quiet danger" onclick="App.deleteRecord('${editing.id}')">Delete</button></span></div>${renderFields(editing,t)}</div>`:''}</div>`}
function reviewPanel(r){const p=progress(r);const missing=[];[r,...project().records.filter(x=>x.parentId===r.id)].forEach(x=>fields(table(x.tableKey)).forEach(f=>{const m=x.meta?.[f.key]||{};if(!terminal(m.status))missing.push({f,x})}));return `<h3 style="margin-top:0">Review</h3><div class="metric">${p.pct}%</div><div class="bar"><i style="width:${p.pct}%"></i></div><p class="muted">${p.done} reviewed · ${p.entered} entered · ${p.total-p.done} remaining</p><hr style="border:0;border-top:1px solid var(--line)"><b>Next to review</b><div class="field-list" style="margin-top:8px">${missing.slice(0,12).map(x=>`<div class="small"><span class="badge warn">${esc(x.f.section||'Details')}</span> ${esc(x.f.label)}</div>`).join('')||'<div class="notice">Everything is reviewed.</div>'}</div><p class="small muted">“Verified” requires a Source Location. Use “Not Available” or “Not Applicable” when there is no value.</p>`}

function dictionaryView(){const p=project(),root=parentTable(),t=table(state.activeTableKey)||p.tables[0],hasConfiguredKey=fields(t).some(f=>f.key===t.keyField),isExtraParent=t.kind==='parent'&&t.key!==root?.key;state.activeTableKey=t.key;return `<div class="two"><aside class="card"><div class="spread"><b>Tables</b><button class="primary" onclick="App.addTable()">+ Add</button></div><p class="small muted">The first normal table is your main record. Every other table that should appear inside it must be a repeating child table.</p><div class="field-list" style="margin-top:12px">${p.tables.map((x,i)=>`<div class="table-item"><button class="list-button ${x.key===t.key?'active':''}" onclick="App.pickTable('${x.key}')"><b>${esc(x.name)}</b><div class="muted small">${x.kind==='parent'?(x.key===root?.key?'Main record form':'Separate table — not on main form'):'Repeating section on '+esc(table(x.parentTable)?.name||'no parent')}</div></button><span class="row"><button class="move" title="Move table up" onclick="App.moveTable(${i},-1)">↑</button><button class="move" title="Move table down" onclick="App.moveTable(${i},1)">↓</button></span></div>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="quiet danger" onclick="App.deleteTable('${t.key}')">Delete selected table</button></aside><section class="card"><div class="spread"><div><h2 style="margin:0">${esc(t.name)}</h2><div class="muted">Use the arrows to order tables and fields. Sections appear in the order of their first field.</div></div><button class="primary" onclick="App.addField('${t.key}')">+ Add field</button></div>${isExtraParent?`<p class="notice"><b>This table is not on the Recipient form yet.</b> Change its Table type below to <b>Repeating child table</b>, then choose <b>${esc(root?.name||'the main record')}</b> as its parent.</p>`:''}<div class="grid" style="grid-template-columns:1fr 180px 140px;gap:10px;margin:15px 0"><label>Table name<input value="${esc(t.name)} lor',this.value)"><span class="row"><button class="move" title="Move field up" onclick="App.moveField('${t.key}',${i},-1)">↑</button><button class="move" title="Move field down" onclick="App.moveField('${t.key}',${i},1)">↓</button><button class="quiet danger move" title="Delete field" onclick="App.deleteField('${t.key}','${f.id}')">×</button></span></div>`).join('')||'<div class="empty">Add fields to build this form.</div>'}</section></div>`}

function viewerView(){const p=project(),pt=parentTable(),rows=[];p.records.forEach(r=>{const t=table(r.tableKey),owner=r.parentId?rec(r.parentId):r,ownerLabel=recordName(owner,pt);fields(t).forEach(f=>{const m=r.meta?.[f.key]||{};rows.push({table:t.name,tableKey:t.key,parent:ownerLabel,record:r.id,field:f.label,value:r.values?.[f.key]||'',status:m.status||'Unreviewed',source:m.sourceLocation||'',edited:m.editedAt||''})})});const q=state.viewerSearch.toLowerCase();const visible=rows.filter(x=>(state.viewerTable==='all'||x.tableKey===state.viewerTable)&&JSON.stringify(x).toLowerCase().includes(q));return `<section class="card"><div class="spread"><div><h2 style="margin:0">Current data</h2><div class="muted">${visible.length} field values shown${visible.length>1000?' (first 1,000 only)':''}</div></div><button onclick="App.exportCSV()">Download this data as CSV</button></div><div class="grid" style="grid-template-columns:240px minmax(0,1fr);gap:10px;margin:16px 0"><label>Table<select onchange="App.viewerTable(this.value)"><option value="all" ${state.viewerTable==='all'?'selected':''}>All tables</option>${p.tables.map(t=>`<option value="${t.key}" ${state.viewerTable===t.key?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Search values, fields, sources, or record IDs<input value="${esc(state.viewerSearch)}" placeholder="Start typing to filter" oninput="App.viewerSearch(this.value)"></label></div><div class="table-wrap"><table><thead><tr><th>Parent record</th><th>Table</th><th>Field</th><th>Value</th><th>Status</th><th>Source location</th><th>Last edited</th></tr></thead><tbody>${visible.slice(0,1000).map(x=>`<tr><td>${esc(x.parent)}</td><td>${esc(x.table)}</td><td>${esc(x.field)}</td><td>${esc(x.value||'—')}</td><td><span class="status ${statusClass(x.status)}">${esc(x.status)}</span></td><td>${esc(x.source||'—')}</td><td>${x.edited?esc(new Date(x.edited).toLocaleString()):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No current d function dataView(){const p=project(),target=table(state.importTable)||p.tables[0],parentForTarget=target.kind==='child'?table(target.parentTable):null;state.importTable=target.key;return `<div class="two"><section class="card"><h2 style="margin-top:0">Local data and backups</h2><p class="notice">Your data stays in this browser until you export it. Download a full backup after each coding session and keep it in a trusted location.</p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px"><button class="primary" onclick="App.exportBackup()">Download full backup (.json)</button><label class="button">Import full backup (.json)<input class="hidden" type="file" accept="application/json" onchange="App.importBackup(this.files[0])"></label><button onclick="App.exportCSV()">Download analysis data (.csv)</button><label class="button">Import analysis data (.csv)<input class="hidden" type="file" accept=".csv,text/csv" onchange="App.importCSV(this.files[0])"></label><button onclick="App.downloadTemplate()">Download dictionary template (.csv)</button><label class="button">Import data dictionary (.csv)<input class="hidden" type="file" accept=".csv,text/csv" onchange="App.importDictionary(this.files[0])"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Import existing table CSV</h3><p class="muted small">Use this for preexisting Recipients, Procedures, Labs, or any other configured section. CSV column names can match field keys or field labels.</p><div class="grid" style="grid-template-columns:1fr 1.4fr;gap:10px"><label>Target table<select onchange="App.importTarget(this.value)">${p.tables.map(t=>`<option value="${t.key}" ${t.key===target.key?'selected':''}>${esc(t.name)}${t.kind==='child'?' (repeating rows)':''}</option>`).join('')}</select></label><label>Source location for this imported file<input value="${esc(state.importSourceLocation)}" placeholder="e.g. /imports/2026-08-31-procedures.csv" onchange="App.importSource(this.value)"></label></div>${target.kind==='child'?`<p class="small notice">For ${esc(target.name)}, include either <b>parent_record_id</b> or the parent key column <b>${esc(recordKeyField(parentForTarget))}</b>.</p>`:''}<div class="row" style="margin-top:10px"><button onclick="App.downloadTableTemplate()">Download ${esc(target.name)} import template</button><label class="button primary">Import ${esc(target.name)} CSV<input class="hidden" type="file" accept=".csv,text/csv" onchange="App.importTableCSV(this.files[0])"></label></div><h3>Username for audit trail</h3><label>Your name or coding initials<input value="${esc(state.username)}" placeholder="e.g. Jamie Lee" onchange="App.username(this.value)"></label><p class="small muted">Each edit records this name and an edit timestamp. Source ID is generated automatically; source location is attached to every value from the imported file.</p></section><aside class="card"><h3 style="margin-top:0">File formats</h3><p><b>Full backup JSON</b><br><span class="muted">Everything: dictionary, form design, records, sources, review status, and timestamps.</span></p><p><b>Analysis CSV</b><br><span class="muted">One row per field value with parent record, child record, source, status, user, and timestamp. This long format imports cleanly into R.</span></p><p><b>Section/table CSV</b><br><span class="muted">Imports a normal table or a repeating child table directly into the selected section.</span></p><h3>Supabase later</h3><p class="muted">When you are ready, this same project JSON can be stored in Supabase. Start local first so you can use it immediately without account setup.</p></aside></div>`}

 exportBackup(){download(project().name.replace(/\W+/g,'-')+'-backup.json',JSON.stringify(project(),null,2),'application/json')},importBackup(file){read(file,text=>{try{const p=JSON.parse(text);if(!p.tables||!p.records)throw Error();p.id=uid();p.name=(p.name||'Imported database')+' (imported)';state.projects.push(p);state.projectId=p.id;state.activeParentId=null;save();render()}catch{alert('That is not a valid FieldForge backup.')}})},

 importTarget(v){state.importTable=v;save();render()},importSource(v){state.importSourceLocation=v;save();render()},downloadTableTemplate(){const t=table(state.importTable)||project().tables[0],head=[...fields(t).map(f=>f.key)];if(t.kind==='child')head.unshift('parent_record_id',recordKeyField(table(t.parentTable)));download(t.key+'-import-template.csv',head.map(csvEscape).join(',')+'\n','text/csv')},importTableCSV(file){if(!state.importSourceLocation.trim()){alert('Enter the source location for this import first.');return}read(file,text=>{const rows=parseCSV(text),head=rows.shift()||[],t=table(state.importTable)||project().tables[0],norm=x=>String(x||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_'),indexes=new Map(head.map((h,i)=>[norm(h),i])),parentT=t.kind==='child'?table(t.parentTable):null;let added=0,skipped=0;rows.forEach(row=>{let parentId=null;if(parentT){const parentField=recordKeyField(parentT),direct=row[indexes.get('parent_record_id')],parentKey=row[indexes.get(norm(parentField))];const parent=direct?rec(direct):parentRecords().find(x=>String(x.values?.[parentField]||'')===String(parentKey||''));if(!parent){skipped++;return}parentId=parent.id}const r=blankRecord(t,parentId,state.importSourceLocation.trim());fields(t).forEach(f=>{const i=indexes.get(norm(f.key))??indexes.get(norm(f.label));if(i===undefined)return;const value=row[i]??'';r.values[f.key]=value;if(value!=='')r.meta[f.key].status='In Progress'});project().records.push(r);added++});save();render();alert(`Imported ${added} ${t.name} row(s).${skipped?` Skipped ${skipped} child row(s) because no matching parent was found.`:''}`)})},

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function read(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(file)}
function parseCSV(text){const out=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){cell+='"';i++}else if(c==='"'){quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))out.push(row);return out}

function dictionaryEditorView(){const p=project(),root=parentTable(),t=table(state.activeTableKey)||p.tables[0],hasConfiguredKey=fields(t).some(f=>f.key===t.keyField),isExtraParent=t.kind==='parent'&&t.key!==root?.key;sources=p.sources??=[];state.activeTableKey=t.key;const tableList=p.tables.map((x,i)=>`<div class="table-item"><button class="list-button ${x.key===t.key?'active':''}" onclick="App.pickTable('${x.key}')"><b>${esc(x.name)}</b><div class="small muted">${x.kind==='parent'?(x.key===root?.key?'Main record form':'Separate table'):'Repeating section'}</div></button><span class="row"><button class="move" onclick="App.moveTable(${i},-1)">↑</button><button class="move" onclick="App.moveTable(${i},1)">↓</button></span></div>`).join('');const fieldRows=fields(t).map((f,i)=>{const choices=['select','button select'].includes(f.type)?`<div style="grid-column:2 / -1;padding:2px 0 8px"><b class="small">Choices</b><div class="field-list">${fieldChoices(f).map((x,j)=>`<div class="row"><input value="${esc(x)}" onchange="App.choiceOption('${t.key}','${f.id}',${j},this.value)"><button class="quiet danger move" onclick="App.deleteChoiceOption('${t.key}','${f.id}',${j})">×</button></div>`).join('')||'<span class="small muted">No choices yet.</span>'}</div><button style="margin-top:5px" onclick="App.addChoiceOption('${t.key}','${f.id}')">+ Add option</button></div>`:'';return `<div class="section-edit"><input type="number" value="${f.order}" onchange="App.fieldProp('${t.key}','${f.id}','order',this.value)"><input value="${esc(f.label)}" onchange="App.fieldProp('${t.key}','${f.id}','label',this.value)"><select onchange="App.fieldProp('${t.key}','${f.id}','type',this.value)">${TYPES.map(x=>`<option value="${x}" ${x===f.type?'selected':''}>${x}</option>`).join('')}</select><input value="${esc(f.section||'Details')}" onchange="App.fieldProp('${t.key}','${f.id}','section',this.value)"><input type="color" value="${f.color||'#0f766e'}" onchange="App.fieldProp('${t.key}','${f.id}','color',this.value)"><span class="row"><button class="move" onclick="App.moveField('${t.key}',${i},-1)">↑</button><button class="move" onclick="App.moveField('${t.key}',${i},1)">↓</button><button class="quiet danger move" onclick="App.deleteField('${t.key}','${f.id}')">×</button></span></div>${choices}`}).join('')||'<div class="empty">Add fields to build this form.</div>';const sourceList=sources.map((x,i)=>`<div class="row"><input value="${esc(x)}" onchange="App.sourceProp(${i},this.value)"><button class="quiet danger move" onclick="App.deleteSource(${i})">×</button></div>`).join('')||'<div class="small muted">No sources added yet.</div>';return `<div class="two"><aside class="card"><div class="spread"><b>Tables</b><button class="primary" onclick="App.addTable()">+ Add</button></div><div class="field-list">${tableList}</div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="spread"><b>Sources</b><button onclick="App.addSource()">+ Add source</button></div><p class="small muted">Manage reusable source file/location choices here.</p><div class="field-list">${sourceList}</div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><button class="quiet danger" onclick="App.deleteTable('${t.key}')">Delete selected table</button></aside><section class="card"><div class="spread"><div><h2 style="margin:0">${esc(t.name)}</h2><div class="small">Configure this table and every field here.</div></div><button class="primary" onclick="App.addField('${t.key}')">+ Add field</button></div>${isExtraParent?`<p class="notice">This is a separate table. Change it to <b>Repeating child table</b> to show it in ${esc(root?.name||'the main record')}.</p>`:''}<div class="grid" style="grid-template-columns:1fr 180px 140px;gap:10px;margin:12px 0"><label>Table name<input value="${esc(t.name)}" onchange="App.tableProp('${t.key}','name',this.value)"></label><label>Table type<select onchange="App.tableProp('${t.key}','kind',this.value)"><option value="parent" ${t.kind==='parent'?'selected':''}>Normal parent table</option><option value="child" ${t.kind==='child'?'selected':''}>Repeating child table</option></select></label><label>Form columns<select onchange="App.tableProp('${t.key}','grid',this.value)">${[1,2,3,4].map(n=>`<option value="${n}" ${+t.grid===n?'selected':''}>${n}</option>`).join('')}</select></label></div>${t.kind==='parent'?`<label style="max-width:360px">Record ID field<select onchange="App.tableProp('${t.key}','keyField',this.value)"><option value="" ${hasConfiguredKey?'':'selected'}>Automatically use ${esc(fields(t).find(f=>f.key===recordKeyField(t))?.label||'the first field')}</option>${fields(t).map(f=>`<option value="${f.key}" ${f.key===t.keyField?'selected':''}>${esc(f.label)}</option>`).join('')}</select></label>`:`<label style="max-width:360px">Connected to parent table<select onchange="App.tableProp('${t.key}','parentTable',this.value)">${p.tables.filter(x=>x.kind==='parent').map(x=>`<option value="${x.key}" ${x.key===t.parentTable?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`}<h3>Fields</h3><div class="section-edit small"><b>Order</b><b>Field label</b><b>Type</b><b>Section</b><b>Color</b><b>Actions</b></div>${fieldRows}</section></div>`}
const dictionaryEditorBase=dictionaryEditorView;
function editorModal(){const modal=state.dictionaryModal;if(!modal)return '';const p=project();if(modal.type==='choice'){const t=table(modal.tableKey),f=t?.fields.find(x=>x.id===modal.fieldId);if(!f)return '';const rows=fieldChoices(f).map((x,i)=>`<div class="row"><input value="${esc(x)}" onchange="App.choiceOption('${t.key}','${f.id}',${i},this.value)"><button class="quiet danger move" onclick="App.deleteChoiceOption('${t.key}','${f.id}',${i})">×</button></div>`).join('')||'<p class="muted">No options yet.</p>';return `<div class="editor-modal"><div class="editor-dialog"><div class="spread"><div><h2 style="margin:0">${esc(f.label)} options</h2><div class="small muted">Add, rename, or delete this field’s allowed values.</div></div><button onclick="App.closeEditor()">Close</button></div><div class="row" style="margin:14px 0"><input id="editor-new-value" placeholder="New option"><button class="primary" onclick="App.addEditorValue()">+ Add option</button></div><div class="field-list">${rows}</div></div></div>`}const rows=(p.sources||[]).map((x,i)=>`<div class="row"><input value="${esc(x)}" onchange="App.sourceProp(${i},this.value)"><button class="quiet danger move" onclick="App.deleteSource(${i})">×</button></div>`).join('')||'<p class="muted">No sources yet.</p>';return `<div class="editor-modal"><div class="editor-dialog"><div class="spread"><div><h2 style="margin:0">Sources</h2><div class="small muted">Reusable source file and location choices.</div></div><button onclick="App.closeEditor()">Close</button></div><div class="row" style="margin:14px 0"><input id="editor-new-value" placeholder="e.g. /records/study-01.pdf"><button class="primary" onclick="App.addEditorValue()">+ Add source</button></div><div class="field-list">${rows}</div></div></div>`}
dictionaryEditorView=function(){const t=table(state.activeTableKey)||project().tables[0],selectors=fields(t).filter(f=>['select','button select'].includes(f.type));let html=dictionaryEditorBase();html=html.replace('<div class="spread"><b>Sources</b><button onclick="App.addSource()">+ Add source</button></div>','<div class="spread"><b>Sources</b><button onclick="App.openSourceEditor()">Manage sources</button></div>');html=html.replace('<h3>Fields</h3>',`${selectors.length?`<div class="notice small">Selector lists: ${selectors.map(f=>`<button onclick="App.openChoiceEditor('${t.key}','${f.id}')">Edit ${esc(f.label)} options</button>`).join(' ')}</div>`:''}<h3>Fields</h3>`);return `<style>.section-edit+div[style*="grid-column"]{display:none}.two>aside hr+.spread+p+.field-list{display:none}.editor-modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:18px}.editor-dialog{width:min(620px,100%);max-height:82vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.editor-dialog .row input{flex:1}</style>${html}${editorModal()}`};
App.closeEditor=()=>{state.dictionaryModal=null;save();render()};
App.openChoiceEditor=(tableKey,fieldId)=>{state.dictionaryModal={type:'choice',tableKey,fieldId};save();render()};
App.openSourceEditor=()=>{const p=project();p.sources??=[];sourceLocations().forEach(value=>{if(!p.sources.some(x=>String(x).toLowerCase()===value.toLowerCase()))p.sources.push(value)});state.dictionaryModal={type:'sources'};save();render()};
App.addEditorValue=()=>{const value=String(document.getElementById('editor-new-value')?.value||'').trim(),modal=state.dictionaryModal;if(!value||!modal)return;if(modal.type==='choice'){const f=table(modal.tableKey)?.fields.find(x=>x.id===modal.fieldId);if(!f)return;f.options=[...fieldChoices(f),value]}else{const p=project();p.sources??=[];if(!p.sources.some(x=>String(x).toLowerCase()===value.toLowerCase()))p.sources.push(value)}save();render()};
function statusLight(status){return `<i class="status-light ${statusClass(status||'Unreviewed')}" title="${esc(status||'Unreviewed')}"></i>`}
function fastEntryTable(r,t){let lastSection='';const rows=fields(t).map(f=>{const m=r.meta?.[f.key]||{},section=f.section||'Details',sectionRow=section===lastSection?'':(lastSection=section,`<tr><th colspan="6" style="text-align:left;border-left:4px solid ${esc(f.color||'#0f766e')}">${esc(section)}</th></tr>`);return `${sectionRow}<tr class="entry-row ${statusClass(m.status)}"><td><b>${esc(f.label)}${f.required?' *':''}</b><div class="small">${esc(m.sourceId||'')}</div></td><td>${fastEntryControl(r,f)}</td><td>${sourcePicker(r,f,true)}</td><td><select onchange="App.meta('${r.id}','${f.key}','status',this.value)">${statusOptions(m.status||'Unreviewed')}</select></td><td><input value="${esc(m.notes||'')}" placeholder="Notes" onchange="App.metaFast('${r.id}','${f.key}','notes',this.value)"></td><td class="small">${m.editedAt?esc(new Date(m.editedAt).toLocaleString()):'—'}</td></tr>`}).join('');return `<div class="table-wrap" style="max-height:none"><table style="min-width:1120px"><thead><tr><th>Field</th><th>Value</th><th>Source file / location</th><th>Status</th><th>Notes</th><th>Edited</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function childSection(parent,t){const rows=project().records.filter(r=>r.tableKey===t.key&&r.parentId===parent.id),fs=fields(t),editing=rec(state.activeChildId);const dataRows=rows.map(row=>`<tr>${fs.map(f=>`<td>${fastEntryControl(row,f)}</td>`).join('')}<td>${progress(row,false).pct}%</td><td><span class="row"><button onclick="App.editChild('${row.id}')">Review / sources</button><button class="quiet danger" onclick="App.deleteRecord('${row.id}')">Delete</button></span></td></tr>`).join('');const editor=editing&&editing.tableKey===t.key&&editing.parentId===parent.id?`<div class="section" style="--section:#7c3aed"><div class="section-title spread"><span>Review and sources for this ${esc(t.name.slice(0,-1)||t.name)}</span><button onclick="App.closeChild()">Done</button></div>${fastEntryTable(editing,t)}</div>`:'';return `<div class="section" style="--section:#7c3aed"><div class="section-title spread"><span>${esc(t.name)} <span class="muted small">(${rows.length})</span></span><button class="primary" onclick="App.addRecord('${t.key}','${parent.id}')">+ Add ${esc(t.name.slice(0,-1)||t.name)}</button></div>${rows.length?`<div class="table-wrap" style="max-height:none"><table style="min-width:800px"><thead><tr>${fs.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th>Review</th><th>Actions</th></tr></thead><tbody>${dataRows}</tbody></table></div>`:`<div class="empty">No related ${esc(t.name.toLowerCase())} yet. Click “+ Add” to create the first row.</div>`}</div>${editor}`}
render();
const dictionaryEditorActionBase=dictionaryEditorView;
dictionaryEditorView=function(){let html=dictionaryEditorActionBase();const t=table(state.activeTableKey)||project().tables[0];fields(t).filter(f=>['select','button select'].includes(f.type)).forEach(f=>{const remove=`<button class="quiet danger move" onclick="App.deleteField('${t.key}','${f.id}')">×</button>`;const edit=`<button onclick="App.openChoiceEditor('${t.key}','${f.id}')">Edit options</button>`;html=html.replace(remove,edit+remove)});return html.replace('<button onclick="App.closeEditor()">Close</button>','<span class="row"><button onclick="App.closeEditor()">Cancel</button><button class="primary" onclick="App.saveEditor()">Save changes</button></span>')};
App.saveEditor=()=>{save();App.closeEditor()};
App.saveEditor=()=>{const modal=state.dictionaryModal;if(!modal)return;const values=[...document.querySelectorAll('.editor-dialog .field-list input')].map(input=>String(input.value||'').trim()).filter(Boolean);if(modal.type==='choice'){const f=table(modal.tableKey)?.fields.find(x=>x.id===modal.fieldId);if(f)f.options=[...new Map(values.map(x=>[x.toLowerCase(),x])).values()]}else project().sources=[...new Map(values.map(x=>[x.toLowerCase(),x])).values()];save();App.closeEditor()};
App.deleteSource=(index)=>{const p=project();p.sources??=[];const value=String(p.sources[index]||'').trim();if(!value)return;if(!confirm(`Delete this source and clear it from every field that uses it?\n\n${value}`))return;p.sources.splice(index,1);p.records.forEach(r=>Object.values(r.meta||{}).forEach(meta=>{if(String(meta?.sourceLocation||'').trim().toLowerCase()===value.toLowerCase())meta.sourceLocation=''}));save();render()};
render();
</script><style>

.table-wrap td select{min-width:135px}
.table-wrap td:nth-child(3) select{min-width:190px}
.table-wrap td:nth-child(5) input{min-width:155px}
.table-wrap table[style]{table-layout:fixed}.table-wrap td:nth-child(3) select{width:210px;min-width:160px;max-width:210px;text-overflow:ellipsis}
.status-cell{display:flex;align-items:center;gap:6px}.status-light{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px;box-shadow:0 0 8px currentColor}.status-light.s-unreviewed{background:#8b98a5;color:#8b98a5}.status-light.s-progress{background:#d99618;color:#d99618}.status-light.s-verified{background:#20a35b;color:#20a35b}.status-light.s-none{background:#8b98a5;color:#8b98a5}
.entry-row td:first-child{border-left:5px solid #8b98a5}.entry-row.s-progress td:first-child{border-left-color:#d99618}.entry-row.s-verified td:first-child{border-left-color:#20a35b}.entry-row.s-none td:first-child{border-left-color:#8b98a5}
[data-theme="light"] .entry-row td:first-child b{color:#111!important}
</style></body></html>
